name: Build Blink IPA

on:
  push:
    tags: ['v*-livecontainer.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Prepare dependencies
        run: |
          ./get_frameworks.sh
          ./get_resources.sh
          cp template_setup.xcconfig developer_setup.xcconfig

      - name: Archive Blink for iOS
        run: |
          xcodebuild archive \
            -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Blink.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        working-directory: ${{ runner.temp }}
        run: |
          mkdir Payload
          mv Blink.xcarchive/Products/Applications/Blink.app Payload/
          lipo Payload/Blink.app/Blink -verify_arch arm64
          zip -qry Blink.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Blink-unsigned-ipa
          path: ${{ runner.temp }}/Blink.ipa
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Blink-unsigned-ipa

      - name: Publish Blink.ipa
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" Blink.ipa \
            --verify-tag --prerelease --latest=false \
            --title "Blink ${RELEASE_TAG#v}" \
            --notes 'Unsigned arm64 Debug IPA for LiveContainer.'
